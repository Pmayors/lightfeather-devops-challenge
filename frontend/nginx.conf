server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app has no client-side router. Files for a deployed environment live
    # under /<env>/ because the image is built with that Vite base path.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
