server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # I copy the built files under /dev, /stage, or /prod in the Dockerfile.
    # This app has no client-side routes, so a missing file is a 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
